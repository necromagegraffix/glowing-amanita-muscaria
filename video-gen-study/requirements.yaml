# Source of truth for what the owner needs. Captured 2026-10-23.
styles: [cinematic_photoreal, stylized_animated, motion_graphics_logo, product_ad]
technical:
  long_clips: true          # 15s+ ; see README note on chaining
  native_audio: true        # sound / dialogue / lip-sync
  character_consistency: true
  resolution: "1080p-4K"
inputs: [text_to_video, image_to_video, video_to_video, start_end_frame]
budget:
  monthly_usd_max: 30
  usage: "exploratory / personal"
open_questions:            # ask the owner before finalizing
  - "Rank must-haves vs nice-to-haves (audio? 4K? length?)"
  - "Commercial use / client work? (license terms differ per plan)"
  - "How many finished seconds per month?"
  - "Have source art (e.g. stills/designs) to animate? Which formats/aspect ratios (16:9, 9:16)?"
  - "Final delivery platform (social, web, broadcast)?"
